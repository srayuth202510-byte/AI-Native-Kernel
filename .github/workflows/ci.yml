name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # Docker service runs in separate container - use TCP
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    # Docker needed for testcontainers-based Qdrant tests
    services:
      docker:
        image: docker:27-dind
        options: --privileged --pid=host
        env:
          DOCKER_TLS_CERTDIR: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-25
          components: rustfmt, clippy
          override: true
          # Built-in Swatinem/rust-cache handles registry + target caching.
          # Do NOT add a manual actions/cache of `target/` — uploading
          # multi-GB release + rocksdb artifacts hangs the job for hours.

      - name: Install eBPF toolchain
        timeout-minutes: 10
        run: bash scripts/install-ebpf-deps.sh --skip-check

      - name: Generate eBPF prebuilt objects (if BTF available)
        timeout-minutes: 10
        run: |
          if [ -f /sys/kernel/btf/vmlinux ]; then
            bash scripts/build-ebpf-objects.sh || echo "eBPF build script failed — using committed prebuilt objects"
          fi
          echo "Prebuilt objects:"
          ls -la crates/kernel-companion/prebuilt-bpf/

      - name: Verify Docker available for testcontainers
        run: |
          docker version
          docker run --rm hello-world

      - name: Wait for Docker daemon to be fully ready
        run: |
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon is ready"
              break
            fi
            echo "Waiting for Docker daemon... ($i/30)"
            sleep 2
          done

      - name: Run CI validation suite
        timeout-minutes: 75
        run: bash scripts/run-ci-validations.sh

      - name: Ensure CI validation summary exists
        if: always()
        run: |
          if [ ! -f target/ci-validation-summary.md ]; then
            mkdir -p target
            {
              echo "# CI Validation Summary"
              echo
              echo "- Overall: UNKNOWN (validation step was cancelled or timed out before writing summary)"
              echo "- Failed stages: unknown"
              echo "- Non-blocking stage warnings: unknown"
              echo
              echo "The validation script did not produce a summary — check the"
              echo "\`Run CI validation suite\` step log for a timeout/cancel."
            } > target/ci-validation-summary.md
          fi
          cat target/ci-validation-summary.md

      - name: Upload CI validation summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-validation-summary
          path: target/ci-validation-summary.md
          if-no-files-found: warn

      - name: Verify prebuilt objects present
        if: always()
        run: |
          echo "BPF objects in prebuilt-bpf/:"
          ls -la crates/kernel-companion/prebuilt-bpf/
          echo "BPF objects in target/bpf/:"
          ls -la crates/kernel-companion/target/bpf/ 2>/dev/null || echo "(none — runtime generation not available)"

  benchmarks:
    # Benchmark regression detection — runs on every PR and push to main
    # Fails if any benchmark shows statistically significant regression (p < 0.05)
    # Stores baseline in actions/cache keyed by branch+commit for comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for baseline comparison

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-25
          override: true

      - name: Install eBPF toolchain
        timeout-minutes: 10
        run: bash scripts/install-ebpf-deps.sh --skip-check

      - name: Cache criterion data
        uses: actions/cache@v4
        with:
          path: |
            target/criterion
            **/target/criterion
          key: criterion-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            criterion-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-

      - name: Run benchmarks
        timeout-minutes: 45
        run: cargo bench --workspace -- --output-format=json > benchmark-results.json 2>&1 || true

      - name: Check for regressions
        timeout-minutes: 5
        run: |
          # Parse criterion JSON output for regressions
          # Regression = change.mean < 0 with p < 0.05 (criterion reports this)
          if grep -q "Performance has regressed" benchmark-results.json; then
            echo "::error::Benchmark regression detected!"
            grep -A 5 "Performance has regressed" benchmark-results.json
            exit 1
          fi
          echo "No benchmark regressions detected."

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: warn

  qdrant-integration:
    # รัน integration tests ของ semantic store กับ Qdrant จริง (ปกติ #[ignore]
    # เพราะต้องมี endpoint) — ปิดช่องว่างที่ gRPC upsert/search path ไม่มี
    # regression coverage อัตโนมัติ pin เวอร์ชันให้ตรงกับที่ validate ด้วยมือ
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      # run-qdrant-tests.sh เห็น QDRANT_URL แล้วใช้ endpoint นี้ (ไม่สตาร์ท mock)
      QDRANT_URL: http://localhost:6334
      # บังคับให้ ignored tests hard-fail แทน self-skip ถ้า endpoint หลุด
      QDRANT_REQUIRED: "1"
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-25
          override: true

      # run-qdrant-tests.sh มี wait loop รอ endpoint พร้อม แล้วรัน
      # `cargo test -p context-memory --lib -- --ignored` ครอบทั้ง 4 ตัว
      # (semantic store x3 + semantic file system x1)
      - name: Run Qdrant-backed integration tests
        timeout-minutes: 20
        run: bash scripts/run-qdrant-tests.sh

  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-25
          override: true

      - name: Install cargo-audit
        timeout-minutes: 10
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        timeout-minutes: 5
        run: cargo audit
