[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AI infrastructure security gateway - OpenAI-compatible enforcement proxy"
license = "MIT"
repository = "https://github.com/srayuth202510-byte/AI-Native-Kernel"
keywords = ["ai", "security", "gateway", "proxy", "zero-trust"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
capability-security = { path = "../capability-security" }
semantic-guard = { path = "../semantic-guard" }
extraction-det = { path = "../extraction-det" }
watchtower = { path = "../watchtower" }
prometheus = { workspace = true }
secrecy = { workspace = true }
async-stream = { workspace = true }
# TLS termination — ring provider เหมือน context-memory/mesh_tls (H7) ไม่ดึง
# aws-lc-rs ที่ต้องมี cmake/nasm ตอน build
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
    "server",
    "server-auto",
    "server-graceful",
    "service",
    "http1",
    "http2",
] }

[[bin]]
name = "ai-gateway"
path = "src/main.rs"

[dev-dependencies]
proptest = { workspace = true }
# สร้าง cert ชั่วคราวสำหรับเทสต์ TLS (loopback) — production อ่าน cert จากไฟล์
rcgen = "0.13"
